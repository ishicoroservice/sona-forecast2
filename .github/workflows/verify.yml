name: Sona v3.3 verification
on:
  push:
    branches: [verify-v3.3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jsdom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact candidate and test reconstruction
        run: |
          test "$(git hash-object index.html)" = '538fa5e17b1d5c359dbebc08ce05b12155d3685e'
          cp test_fetcher.base.js test_fetcher.js
          gzip -dc test_fetcher.patch.gz | git apply --unidiff-zero
          echo '8cd98b7ccd92cf16014d266536291ea02ee10659bafbeead307150348c7f5024  test_fetcher.js' | sha256sum -c
          git apply test_fetcher.final.patch
          echo 'eb6da0d06aabf9d1faef9595d0f687f348a1617d4470a836e60619bd46084945  test_fetcher.js' | sha256sum -c
          gzip -dc test_fetcher.v33.patch.gz | git apply
          echo '6e9333afef0c2179da6d98b8dc6e24ac804b29111728ebb64bde285f54431d28  test_fetcher.js' | sha256sum -c
          gzip -dc test_fetcher.v33dev2.patch.gz | git apply
          echo '02808e6df11230d33f5230ae170f24062c34f9cc75bf25f94abecb78b4ea2933  test_fetcher.js' | sha256sum -c
          gzip -dc test_fetcher.v33rc1.patch.gz | git apply
          echo 'e8a6643b05c3748822856e1ffacaad10f9f73c3cfc8be075740b1e644a788d90  test_fetcher.js' | sha256sum -c
          git apply test_fetcher.v33rc2.patch
          echo 'f819aad1fce66dc013d86a478423e8ae0d82f279deac422be8594e0978f6e532  test_fetcher.js' | sha256sum -c
          gzip -dc test_fetcher.v33rc3.patch.gz | git apply --unidiff-zero
          echo '2f7bad91e85476c8d53b216b824cfe1a39dae6da30454f37085048c434dc2f05  test_fetcher.js' | sha256sum -c
          git apply test_fetcher.v33final.patch
          echo 'c1260dc52b5fec124357fce043bc6c116d0227e4e9c2bff703dfa530594bd3de  test_fetcher.js' | sha256sum -c
          gzip -dc test_fetcher.ui.patch.gz | git apply
          echo 'efe31c915ce05439be591d05f5f4453b8179d72cf0f53860d1ca6b12f0b25eb7  test_fetcher.js' | sha256sum -c
      - run: npm install --no-save --no-package-lock jsdom@26.1.0
      - run: node test_fetcher.js
